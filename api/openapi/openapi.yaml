# situs OpenAPI specification — the HTTP contract.
#
# Every path/method here must have a matching registered route and vice versa:
# TestRoutesMatchOpenAPISpec fails otherwise, in both directions.
#
# This file is embedded into the binary and served at GET /openapi. It must stay
# byte-identical to api/openapi/openapi.yaml (TestOpenAPICopiesAreIdentical).
openapi: 3.0.3
info:
  title: situs API
  description: >-
    Lokaler, schreibgeschützter Dienst für EUNIS-Habitattypen: Art →
    Habitattypen (mit Rolle) und Habitattyp → Arten / Syntaxa / Crosswalks,
    aus gepinnten EEA- und ESy-Artefakten, mit deutschen Labels und einem
    Anhang-I-Crosswalk (annex1).
  version: 0.1.1 # x-release-please-version
  license:
    name: MIT
servers:
  # Relativ, absichtlich: Swagger-UI baut die "Try it out"-Anfragen aus diesem
  # Eintrag. Eine absolute URL mit festem Port zeigt am tatsächlich benutzten
  # Port vorbei, sobald der Dienst nicht auf dem dort genannten läuft. Relativ
  # löst gegen die Herkunft der Seite auf und trifft damit immer den Server, der
  # sie ausgeliefert hat.
  - url: /
    description: Derselbe Server, der diese Spezifikation ausliefert

paths:
  /health/live:
    get:
      summary: Liveness-Probe
      description: Antwortet 200, solange der Prozess HTTP bedienen kann.
      operationId: healthLive
      responses:
        "200":
          description: Der Prozess lebt.
  /health/ready:
    get:
      summary: Readiness-Probe
      description: >-
        Antwortet 503, solange der Index nicht benutzbar ist — ein Orchestrator
        soll erst danach Verkehr zustellen.
      operationId: healthReady
      responses:
        "200":
          description: Der Dienst ist bereit.
        "503":
          description: Der Dienst ist noch nicht bereit.
  /metrics:
    get:
      summary: Prometheus-Metriken
      operationId: metrics
      responses:
        "200":
          description: Metriken im Prometheus-Textformat.
          content:
            text/plain:
              schema:
                type: string
  /openapi:
    get:
      summary: Diese Spezifikation
      operationId: openapi
      responses:
        "200":
          description: Die eingebettete OpenAPI-Spezifikation als YAML.
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      summary: API-Dokumentation (Swagger-UI)
      description: >-
        Eine selbst-enthaltene Swagger-UI-Seite für diese Spezifikation. Stylesheet
        und Bundle sind eingebettet, nicht von einem CDN geladen — situs läuft
        lokal und im Feld ohne Netz. Die Seite lädt die Spezifikation von
        `GET /openapi` desselben Servers.
      operationId: docs
      responses:
        "200":
          description: Die Swagger-UI-Seite als HTML.
          content:
            text/html:
              schema:
                type: string
  /v1/info:
    get:
      summary: Dienst- und Build-Information
      operationId: info
      responses:
        "200":
          description: Name und Version des Dienstes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /v1/habitat-type/{typology}/{code}:
    get:
      summary: Ein Habitattyp mit Arten, Syntaxa und Crosswalks
      description: >-
        Dieselbe Route trägt EUNIS und Anhang I — ein Habitattyp wird immer über
        (typology, code) adressiert. Die Crosswalk-Liste trägt beides: andere
        EUNIS-Fassungen und Anhang-I-Entsprechungen. Sie ist leer, wenn es keine
        gibt; bei Anhang I ist das der Normalfall.
      operationId: habitatType
      parameters:
        - $ref: "#/components/parameters/Typology"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/Area"
        - $ref: "#/components/parameters/OnlyInArea"
      responses:
        "200":
          description: Der Habitattyp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitatTypeDetail"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/habitat-type/{typology}/{code}/species:
    get:
      summary: Artenliste eines Habitattyps, optional nach Rolle gefiltert
      operationId: habitatTypeSpecies
      parameters:
        - $ref: "#/components/parameters/Typology"
        - $ref: "#/components/parameters/Code"
        - name: role
          in: query
          required: false
          description: Filtert auf eine Rolle; ohne Angabe werden alle geliefert.
          schema:
            $ref: "#/components/schemas/Role"
        - $ref: "#/components/parameters/Area"
        - $ref: "#/components/parameters/OnlyInArea"
      responses:
        "200":
          description: Die Arten des Habitattyps.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeciesEntry"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/species/{conceptId}/habitat-types:
    get:
      summary: Habitattypen einer Art (mit Rolle)
      description: >-
        Die Kernfrage der Exkursions-App. Autark: eine Konzept-ID braucht keinen
        Upstream-Dienst.
      operationId: speciesHabitatTypes
      parameters:
        - name: conceptId
          in: path
          required: true
          description: Konzept-ID aus hostus.
          schema:
            type: string
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/Area"
        - $ref: "#/components/parameters/OnlyInArea"
      responses:
        "200":
          description: Die Habitattypen samt Rolle der Art.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitatTypeRole"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description: >-
            Der Index kennt keine Fakten zu dieser Konzept-ID (NOT_FOUND). Eine
            Konzept-ID existiert hier nur, weil eine Artenzeile sie trägt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/species/habitat-types:
    post:
      summary: Habitattypen zu einem Satz Konzept-IDs (Batch)
      description: >-
        Eine ganze Geländeaufnahme in einer Anfrage, und autark: situs löst zur
        Laufzeit keine verbatim Namen auf, der Aufrufer schickt bereits
        aufgelöste Konzept-IDs. Kann der Index eine ID nicht beantworten, wird
        sie mit known=false und einem reason zurückgemeldet, nie verworfen.
      operationId: speciesSetHabitatTypes
      parameters:
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/Area"
        - $ref: "#/components/parameters/OnlyInArea"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept_ids]
              properties:
                concept_ids:
                  type: array
                  description: >-
                    Konzept-IDs, wie der Aufrufer sie aufgelöst hat. Mehr als
                    maxItems Einträge ergeben INVALID_QUERY. Doppelte IDs sind
                    erlaubt: intern wird die Index-Arbeit dedupliziert, die
                    Antwort trägt aber einen Eintrag je Eingabe in
                    Eingabereihenfolge, sodass response[i] zu concept_ids[i]
                    gehört.
                  minItems: 1
                  maxItems: 300
                  items:
                    type: string
                    example: "wcvp:concept:123456"
      responses:
        "200":
          description: >-
            Je Eingabe-Konzept-ID ein Eintrag, in Eingabereihenfolge,
            Duplikate eingeschlossen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConceptResolution"
        "400":
          $ref: "#/components/responses/InvalidQuery"
  /v1/syntaxon/{id}/habitat-types:
    get:
      summary: Habitattypen einer Pflanzengesellschaft
      description: >-
        Zeigt das m:n — dieselbe Gesellschaft kann in mehreren Habitattypen
        vorkommen.
      operationId: syntaxonHabitatTypes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Die verknüpften Habitattypen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitatTypeSummary"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Typology:
      name: typology
      in: path
      required: true
      description: >-
        Typologie in ihrer Fassung. Ein leeres Segment fällt auf eunis@2021
        zurück (der Pfad selbst verlangt ein Segment, weglassen lässt sich es
        also nicht). Eine unbekannte Typologie ist INVALID_QUERY, kein
        NOT_FOUND.
      schema:
        type: string
        example: eunis@2021
    Code:
      name: code
      in: path
      required: true
      description: Code des Habitattyps innerhalb der Typologie.
      schema:
        type: string
        example: R22
    Lang:
      name: lang
      in: query
      required: false
      description: >-
        Antwortsprache, alternativ per Accept-Language. Lokalisierte Felder
        kommen additiv hinzu — name_en bleibt immer gesetzt. Default ist en.
      schema:
        type: string
        enum: [en, de]
    Area:
      name: area
      in: query
      required: false
      description: >-
        Gebietscode nach WGSRPD Level 3 — das Frontend leitet ihn aus GPS ab, so
        braucht situs keine ISO-Zuordnung. Ist er gesetzt, tragen die Arten- und
        Habitattyp-Einträge zusätzlich in_area. Ein Code, zu dem der Index keine
        Verbreitungsdaten hat, ist INVALID_QUERY und nicht "kommt nicht vor" —
        sonst sähen ein Tippfehler und eine echte Abwesenheit gleich aus.
      schema:
        type: string
        example: GER
    OnlyInArea:
      name: only_in_area
      in: query
      required: false
      description: >-
        Verwirft die sicheren Abwesenheiten (in_area=false). Was nicht beurteilbar
        ist (in_area fehlt), bleibt immer stehen. Ohne area ist der Parameter
        absichtlich wirkungslos statt ein Fehler. Auf dem Batch-Endpunkt markiert
        area nur, verwirft aber keinen Eintrag: dort gehört response[i] zu
        concept_ids[i], ein Eintrag darf also nicht fehlen.
      schema:
        type: boolean
  responses:
    InvalidQuery:
      description: Die Anfrage ist fehlerhaft (INVALID_QUERY).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Es gibt keinen solchen Eintrag (NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Role:
      type: string
      enum: [diagnostic, constant, dominant]
    # Fehlende Angaben sind abwesende Felder, nie ein Platzhalter oder eine
    # substituierte Null: level fehlt bei Typologien ohne Hierarchie, priority
    # gibt es nur bei annex1, name_de nur wenn ein Label existiert.
    HabitatTypeSummary:
      type: object
      required: [typology, code, name_en]
      properties:
        typology:
          type: string
          example: eunis@2021
        code:
          type: string
          example: R22
        level:
          type: integer
        name_en:
          type: string
        name_de:
          type: string
        name_de_provenance:
          type: string
          enum: [official, curated, derived]
        priority:
          type: boolean
    SyntaxonRef:
      type: object
      required: [id, rank, name]
      properties:
        id:
          type: string
        rank:
          type: string
          enum: [class, order, alliance]
        name:
          type: string
    CrosswalkRef:
      description: >-
        Die Gegenseite einer Entsprechung, gesehen vom abgefragten Typ. Der
        Qualifier liest sich immer als "abgefragter Typ <qualifier> dieser Typ".
      type: object
      required: [typology, code, qualifier]
      properties:
        typology:
          type: string
        code:
          type: string
        qualifier:
          type: string
          example: "="
    SpeciesEntry:
      description: >-
        verbatim_name ist immer gesetzt; concept_id fehlt, wenn der Name nicht
        auf ein hostus-Konzept auflösbar war — solche Zeilen werden behalten.
      type: object
      required: [verbatim_name, role]
      properties:
        concept_id:
          type: string
        verbatim_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        fidelity:
          type: number
        constancy:
          type: number
        in_area:
          $ref: "#/components/schemas/InArea"
    HabitatTypeDetail:
      allOf:
        - $ref: "#/components/schemas/HabitatTypeSummary"
        - type: object
          required: [species, syntaxa, crosswalks]
          properties:
            species:
              description: >-
                Nach Rolle gruppiert; die drei bekannten Rollen sind immer
                vorhanden, ggf. als leere Liste.
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: "#/components/schemas/SpeciesEntry"
            syntaxa:
              type: array
              items:
                $ref: "#/components/schemas/SyntaxonRef"
            crosswalks:
              type: array
              items:
                $ref: "#/components/schemas/CrosswalkRef"
    HabitatTypeRole:
      allOf:
        - $ref: "#/components/schemas/HabitatTypeSummary"
        - type: object
          required: [role, syntaxa]
          properties:
            role:
              $ref: "#/components/schemas/Role"
            fidelity:
              type: number
            constancy:
              type: number
            syntaxa:
              type: array
              items:
                $ref: "#/components/schemas/SyntaxonRef"
            in_area:
              $ref: "#/components/schemas/InArea"
    InArea:
      description: >-
        Dreiwertig: true/false, wenn der Index Verbreitungsdaten zum Konzept
        hat, und abwesend, wenn die Frage nicht beantwortbar ist (keine
        Konzept-ID oder keine Verbreitungszeilen). Ohne ?area= fehlt das Feld
        immer — Abwesenheit ist hier "unbekannt", nie "kommt nicht vor".
      type: boolean
    ConceptResolution:
      description: >-
        Ein Eintrag der Batch-Antwort. Bei known=false ist habitat_types leer und
        reason sagt, warum: unknown_backbone heißt, die ID stammt aus einer
        anderen taxonomischen Referenz als der, gegen die der Index gebaut wurde
        (ihre IDs können hier gar nicht treffen); unknown_concept heißt, die
        Referenz stimmt, aber der Index kennt keine Habitat-Fakten zu diesem
        Konzept. Die Eingabe wird in beiden Fällen zurückgemeldet, nie verworfen.
      type: object
      required: [concept_id, known, habitat_types]
      properties:
        concept_id:
          type: string
        known:
          type: boolean
        reason:
          type: string
          enum: [unknown_backbone, unknown_concept]
        in_area:
          $ref: "#/components/schemas/InArea"
        habitat_types:
          type: array
          items:
            $ref: "#/components/schemas/HabitatTypeRole"
    Info:
      type: object
      required: [service, version]
      properties:
        service:
          type: string
        version:
          type: string
    # Die einheitliche Fehlerhülle jeder Antwort (writeError) — identisch zu
    # hostus. Codes: INVALID_QUERY, NOT_FOUND, INTERNAL_ERROR. Es gibt kein
    # UPSTREAM_UNAVAILABLE: der Lesepfad ist autark, zur Laufzeit hängt kein
    # Upstream-Dienst daran. Eine Konzept-ID, die der Index nicht beantworten
    # kann, ist ausdrücklich KEIN Fehler: der Batch-Endpunkt meldet sie je
    # Eingabe mit known=false und einem reason zurück, damit eine unbekannte ID
    # nicht die ganze Anfrage verwirft.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
