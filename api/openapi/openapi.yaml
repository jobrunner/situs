# situs OpenAPI specification — the HTTP contract.
#
# Every path/method here must have a matching registered route and vice versa:
# TestRoutesMatchOpenAPISpec fails otherwise, in both directions.
#
# This file is embedded into the binary and served at GET /openapi. It must stay
# byte-identical to api/openapi/openapi.yaml (TestOpenAPICopiesAreIdentical).
openapi: 3.0.3
info:
  title: situs API
  description: >-
    Lokaler, schreibgeschützter Dienst für EUNIS-Habitattypen: Art →
    Habitattypen (mit Rolle) und Habitattyp → Arten / Syntaxa / Crosswalks,
    aus gepinnten EEA- und ESy-Artefakten, mit deutschen Labels und einem
    Anhang-I-Crosswalk (annex1).
  version: 0.11.1 # x-release-please-version
  license:
    name: MIT
servers:
  # Relativ, absichtlich: Swagger-UI baut die "Try it out"-Anfragen aus diesem
  # Eintrag. Eine absolute URL mit festem Port zeigt am tatsächlich benutzten
  # Port vorbei, sobald der Dienst nicht auf dem dort genannten läuft. Relativ
  # löst gegen die Herkunft der Seite auf und trifft damit immer den Server, der
  # sie ausgeliefert hat.
  - url: /
    description: Derselbe Server, der diese Spezifikation ausliefert

paths:
  /:
    get:
      summary: API-Explorer
      description: >-
        Eine selbst-enthaltene Weboberfläche, die jeden Lese-Endpunkt dieses
        Dienstes ausprobierbar macht und dabei die jeweils abgesetzte URL
        mitzeigt. Stylesheet und Skript sind eingebettet, nichts wird aus dem
        Netz nachgeladen — situs läuft lokal und im Feld ohne Netz. Die Seite
        rechnet nichts selbst aus: sie zeigt, was der Dienst antwortet.
      operationId: explorer
      responses:
        "200":
          description: Die Explorer-Seite als HTML.
          content:
            text/html:
              schema:
                type: string
  /health/live:
    get:
      summary: Liveness-Probe
      description: Antwortet 200, solange der Prozess HTTP bedienen kann.
      operationId: healthLive
      responses:
        "200":
          description: Der Prozess lebt.
  /health/ready:
    get:
      summary: Readiness-Probe
      description: >-
        Antwortet 503, solange der Index nicht benutzbar ist — ein Orchestrator
        soll erst danach Verkehr zustellen.
      operationId: healthReady
      responses:
        "200":
          description: Der Dienst ist bereit.
        "503":
          description: Der Dienst ist noch nicht bereit.
  /metrics:
    get:
      summary: Prometheus-Metriken
      operationId: metrics
      responses:
        "200":
          description: Metriken im Prometheus-Textformat.
          content:
            text/plain:
              schema:
                type: string
  /openapi:
    get:
      summary: Diese Spezifikation
      operationId: openapi
      responses:
        "200":
          description: Die eingebettete OpenAPI-Spezifikation als YAML.
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      summary: API-Dokumentation (Swagger-UI)
      description: >-
        Eine selbst-enthaltene Swagger-UI-Seite für diese Spezifikation. Stylesheet
        und Bundle sind eingebettet, nicht von einem CDN geladen — situs läuft
        lokal und im Feld ohne Netz. Die Seite lädt die Spezifikation von
        `GET /openapi` desselben Servers.
      operationId: docs
      responses:
        "200":
          description: Die Swagger-UI-Seite als HTML.
          content:
            text/html:
              schema:
                type: string
  /v1/info:
    get:
      summary: Dienst-, Build- und Index-Information
      description: >-
        Nennt neben Name und Version, worauf der Index gebaut ist: die
        vorkommenden Konzept-Backbones, die Zahl der Konzepte, das Gebietsschema
        und die Zahl der Gebiete mit Verbreitungsdaten. So kann ein Client vorab
        prüfen, ob seine Konzept-IDs zu diesem Index passen. Beantwortbar sind
        allerdings nur `wcvp:`-IDs: die Batch-Route prüft gegen ein fest
        einkompiliertes Präfix, nicht gegen diese Auskunft — sie macht einen
        Bruch sichtbar, sie verschiebt die Prüfung nicht. Schlägt eine der
        beiden Index-Abfragen fehl, ist die Antwort 500 und nicht ein mit
        Nullen gefülltes `index`-Objekt.
      operationId: info
      responses:
        "200":
          description: Name, Version und Selbstauskunft des Index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/typologies:
    get:
      summary: Alle geführten Typologien
      description: >-
        Jede Habitattyp-Route adressiert immer über (typology, code) — diese
        Route ist der Einstiegspunkt, der die gültigen `typology`-Werte
        überhaupt bekannt macht, statt sie in der Doku nachschlagen zu
        müssen. Sortiert nach `id`, damit dieselbe Anfrage stabil dieselbe
        Reihenfolge liefert. `habitat_types` ist wie jede Zahl in `/v1/info`
        am Index **gemessen**, nie konfiguriert: `0` heißt, die Typologie ist
        registriert, aber (noch) nicht gefüllt — eine ehrliche Aussage, kein
        Fehler. Die Antwort ist immer ein Array, auch wenn der Index keine
        Typologie führt.
      operationId: typologies
      responses:
        "200":
          description: Alle Typologien, nach `id` sortiert.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TypologyView"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/areas:
    get:
      summary: Alle Gebiete eines Schemas, nach denen gefiltert werden kann
      description: >-
        Der Einstiegspunkt für `?area=`: die Gebiete eines Schemas, zu denen
        **dieser** Index Verbreitungsdaten hat, jedes mit seinem englischen
        Namen. `?scheme=` wählt das Schema (Vorgabe `wgsrpd_l3`); welche
        Tabelle die Abdeckung liefert, hängt davon ab —
        `species_distribution` für `wgsrpd_l3`, `syntaxon_distribution` für
        `evc_territory`. Bewusst nur Gebiete mit Daten — ein Gebiet ohne Daten
        wäre ein Filter, der nur leer antworten kann. Sortiert nach `code`,
        damit dieselbe Anfrage stabil dieselbe Reihenfolge liefert. `name` ist
        leer, wenn zu einem Code kein Name eingelesen wurde: der Code ist die
        Identität, der Name nur ein Overlay darauf. Die Antwort ist immer ein
        Array, auch wenn der Index keine Verbreitungsdaten führt, und trägt
        nie die Codes zweier Schemata gemischt.
      operationId: areas
      parameters:
        - $ref: "#/components/parameters/AreaScheme"
      responses:
        "200":
          description: Alle Gebiete des Schemas mit Daten, nach `code` sortiert.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaView"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/habitat-type/{typology}/{code}:
    get:
      summary: Ein Habitattyp mit Arten, Syntaxa und Crosswalks
      description: >-
        Dieselbe Route trägt EUNIS und Anhang I — ein Habitattyp wird immer über
        (typology, code) adressiert. Die Crosswalk-Liste trägt beides: andere
        EUNIS-Fassungen und Anhang-I-Entsprechungen. Sie ist leer, wenn es keine
        gibt; bei Anhang I ist das der Normalfall.
      operationId: habitatType
      parameters:
        - $ref: "#/components/parameters/Typology"
        - $ref: "#/components/parameters/Code"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/Area"
        - $ref: "#/components/parameters/OnlyInArea"
      responses:
        "200":
          description: Der Habitattyp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitatTypeDetail"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/habitat-type/{typology}/{code}/species:
    get:
      summary: Artenliste eines Habitattyps, optional nach Rolle gefiltert
      operationId: habitatTypeSpecies
      parameters:
        - $ref: "#/components/parameters/Typology"
        - $ref: "#/components/parameters/Code"
        - name: role
          in: query
          required: false
          description: Filtert auf eine Rolle; ohne Angabe werden alle geliefert.
          schema:
            $ref: "#/components/schemas/Role"
        - $ref: "#/components/parameters/Area"
        - $ref: "#/components/parameters/OnlyInArea"
      responses:
        "200":
          description: Die Arten des Habitattyps.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeciesEntry"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/species/search:
    get:
      summary: Namen suchen, die dieser Index selbst führt
      description: >-
        Sucht einen Teilstring (case-insensitiv) in den `verbatim_name`, die
        der Index selbst trägt, und liefert die zugehörige Concept-ID mit.
        **Das ist keine Namensauflösung:** kein Fuzzy-Matching, keine
        Synonyme, keine Autorenvarianten, kein Backbone-Wissen — dafür ist
        hostus zuständig. Diese Route beantwortet ausschließlich „welche
        Namen kennt *dieser* Index". `concept_id` ist `null`, wenn der Ingest
        den Namen nicht auflösen konnte; solche Treffer werden mitgeliefert
        und nicht gefiltert, weil sie zur Wahrheit über den Index gehören.
      operationId: speciesSearch
      parameters:
        - name: q
          in: query
          required: true
          description: >-
            Teilstring, mindestens ein Zeichen. Leer ist INVALID_QUERY, nicht
            „alles". Auch ein Wert, der ausschließlich aus Leerraum besteht,
            wird nach dem Trimmen als leer behandelt und ergibt ebenfalls
            INVALID_QUERY — dies lässt sich in OpenAPI 3.0.3 nicht formal
            ausdrücken.
          schema:
            type: string
            minLength: 1
          example: fagus
        - name: limit
          in: query
          required: false
          description: Höchstzahl der Treffer. Fehlt der Parameter, gilt 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Die Treffer, nach Namen sortiert. Leer, wenn nichts passt.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpeciesSearchHit"
        "400":
          $ref: "#/components/responses/InvalidQuery"
  /v1/species/{conceptId}/habitat-types:
    get:
      summary: Habitattypen einer Art (mit Rolle)
      description: >-
        Die Kernfrage der Exkursions-App. Autark: eine Konzept-ID braucht keinen
        Upstream-Dienst.
      operationId: speciesHabitatTypes
      parameters:
        - name: conceptId
          in: path
          required: true
          description: Konzept-ID aus hostus.
          schema:
            type: string
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/Area"
        - $ref: "#/components/parameters/OnlyInArea"
      responses:
        "200":
          description: Die Habitattypen samt Rolle der Art.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitatTypeRole"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "404":
          description: >-
            Der Index kennt keine Fakten zu dieser Konzept-ID (NOT_FOUND). Eine
            Konzept-ID existiert hier nur, weil eine Artenzeile sie trägt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/species/{conceptId}/traits:
    get:
      summary: Pflanzenökologische Zeigerwerte einer Art
      description: >-
        Zeigerwerte aller ingestierten Vokabulare (EIVE, Tichý, Midolo) zu
        einer Konzept-ID, optional auf ein Vokabular gefiltert. Autark: eine
        Konzept-ID braucht keinen Upstream-Dienst. Ein Konzept ohne
        Trait-Daten liefert ein leeres Array, kein 404 — "keine Daten" ist
        hier eine normale Antwort.
      operationId: speciesTraits
      parameters:
        - name: conceptId
          in: path
          required: true
          description: Konzept-ID aus hostus.
          schema:
            type: string
        - name: vocab
          in: query
          required: false
          description: >-
            Filtert auf ein Vokabular (z. B. "eive"). Unbekannter Wert (kein
            ingestiertes Vokabular) -> 400 INVALID_QUERY.
          schema:
            type: string
      responses:
        "200":
          description: Die Zeigerwerte, je Vokabular gruppiert, nie vermischt.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraitSet"
        "400":
          $ref: "#/components/responses/InvalidQuery"
  /v1/species/habitat-types:
    post:
      summary: Habitattypen zu einem Satz Konzept-IDs (Batch)
      description: >-
        Eine ganze Geländeaufnahme in einer Anfrage, und autark: situs löst zur
        Laufzeit keine verbatim Namen auf, der Aufrufer schickt bereits
        aufgelöste Konzept-IDs. Kann der Index eine ID nicht beantworten, wird
        sie mit known=false und einem reason zurückgemeldet, nie verworfen.
      operationId: speciesSetHabitatTypes
      parameters:
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/Area"
        - $ref: "#/components/parameters/OnlyInArea"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept_ids]
              properties:
                concept_ids:
                  type: array
                  description: >-
                    Konzept-IDs, wie der Aufrufer sie aufgelöst hat. Mehr als
                    maxItems Einträge ergeben INVALID_QUERY. Doppelte IDs sind
                    erlaubt: intern wird die Index-Arbeit dedupliziert, die
                    Antwort trägt aber einen Eintrag je Eingabe in
                    Eingabereihenfolge, sodass response[i] zu concept_ids[i]
                    gehört — ausnahmslos. Ein leerer Eintrag ist deshalb
                    INVALID_QUERY und wird nicht übersprungen: übersprungen
                    verschöbe er die ganze Liste des Aufrufers um eins.
                  minItems: 1
                  maxItems: 300
                  items:
                    type: string
                    minLength: 1
                    example: "wcvp:concept:123456"
      responses:
        "200":
          description: >-
            Je Eingabe-Konzept-ID ein Eintrag, in Eingabereihenfolge,
            Duplikate eingeschlossen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConceptResolution"
        "400":
          $ref: "#/components/responses/InvalidQuery"
  /v1/species/traits/summary:
    post:
      summary: Zeigerwertanalyse über eine Artenliste
      description: >-
        Mittelt die Zeigerwerte einer Artenliste — **strikt je Vokabular und
        Dimension**, niemals darüber hinweg: EIVE (0–10) und Tichý (1–12)
        sind verschiedene Skalen, ihr gemeinsames Mittel wäre eine erfundene
        Zahl. Neben dem arithmetischen Mittel wird, wo Nischenbreiten
        vorliegen (nur EIVE), ein mit `1/Nischenbreite` gewichtetes Mittel
        ausgewiesen: eine schmale Nische ist der präzisere Standortanzeiger.
        Beide stehen nebeneinander, damit die Methodenwahl beim Auswertenden
        bleibt. Unbekannte Concept-IDs sind ein normales 200 mit Begründung,
        kein Fehler.
      operationId: speciesTraitSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [concept_ids]
              properties:
                concept_ids:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items:
                    type: string
                    minLength: 1
                    example: "wcvp:concept:123456"
                  example: ["wcvp:concept:83891", "wcvp:concept:2692970"]
      responses:
        "200":
          description: Die Analyse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraitSummary"
        "400":
          $ref: "#/components/responses/InvalidQuery"
  /v1/syntaxa:
    get:
      summary: Die Wurzeln der Syntaxa-Hierarchie, filterbar
      description: >-
        Der Einstiegspunkt der Navigation. Ohne Parameter sind es die 25
        Formationen (die Wurzeln), **nicht** alle 1882 Zeilen — ein Vorgabewert,
        der die ganze Tabelle ausgibt, wäre eine Antwort, die niemand
        angefordert hat. `?rank=` liefert stattdessen alle Syntaxa eines Rangs
        (`?rank=alliance` sind 1326 Zeilen, bewusst ohne Paginierung: die Zahl
        ist fest und wächst nur mit einer neuen Quellfassung).
        `?life_form_group=` filtert über die Formation, zu der ein Syntaxon
        gehört; beide Parameter wirken kombiniert als UND. Die Antwort trägt
        `SyntaxonRef` und nicht `SyntaxonDetail`: die Wurzeln brauchen weder
        Ahnenpfad (leer) noch Kinderliste — die holt der nächste Schritt.
        `?area=` (mit `?include=`) filtert zusätzlich auf Vorkommen in einem
        Gebiet; Syntaxa ohne Aussage bleiben mitgeführt, siehe die
        Parameterbeschreibung. `?lang=de` legt den deutschen Namen der
        Formationen als `name_de` zusätzlich auf — nur die 25 Formationen sind
        übersetzt, tiefere Ränge tragen das Feld nicht.
      operationId: syntaxa
      parameters:
        - $ref: "#/components/parameters/Rank"
        - $ref: "#/components/parameters/LifeFormGroup"
        - $ref: "#/components/parameters/SyntaxonArea"
        - $ref: "#/components/parameters/SyntaxonInclude"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Die Syntaxa des angefragten Rangs, nach `id` sortiert.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyntaxonRef"
        "400":
          $ref: "#/components/responses/InvalidQuery"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/syntaxon/{id}:
    get:
      summary: Ein Syntaxon mit Ahnenpfad und direkten Kindern
      description: >-
        Ein Navigationsschritt in einer Antwort: wo bin ich, und wohin kann
        ich? `ancestors` ist der Weg zur Wurzel, **äußerste zuerst** (Formation,
        Klasse, Ordnung) und damit unverändert als Brotkrumenzeile ausgebbar;
        `children` sind die direkten Kinder, nach `id` sortiert. Beide Felder
        sind **immer** vorhanden, auch leer — ein Verband ohne Kinder und eine
        Formation ohne Ahnen sind der Normalfall an den Rändern der Daten, kein
        Fehler. Es gibt bewusst keine eigene `/children`- oder
        `/ancestors`-Route: sie wären ein zweiter Weg zu denselben Daten.
        `?lang=de` legt `name_de` additiv auf — auf die Einheit selbst, auf
        jeden Ahnen und auf jedes Kind. Die Ahnen sind der Grund: sie sind die
        Brotkrumenzeile, und eine deutsche Zeile, die in einer englischen
        Wurzel endet, wäre halb übersetzt. Übersetzt sind die 25 Formationen;
        die übrigen Ränge tragen das Feld nicht. `id` nimmt sowohl die aktuelle
        Syntaxon-ID (EVC-Primärcode, z. B. `AA01A`) als auch den historischen
        EEA-EUNIS-Code (z. B. `PAP-01A`, gespeichert in `eea_code`) an: findet
        sich keine ID-Zeile, wird zusätzlich per `eea_code` gesucht. Der
        Fallback ist eindeutig — kein `eea_code` kollidiert mit einer fremden
        ID, kein `eea_code` ist doppelt vergeben —, eine ID-Zeile hat also
        immer Vorrang, ohne dass es dafür eine Regel bräuchte.
      operationId: syntaxon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: CA01A
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Das Syntaxon samt Umgebung.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyntaxonDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/syntaxon/{id}/habitat-types:
    get:
      summary: Habitattypen einer Pflanzengesellschaft
      description: >-
        Zeigt das m:n — dieselbe Gesellschaft kann in mehreren Habitattypen
        vorkommen. `id` nimmt wie bei `GET /v1/syntaxon/{id}` sowohl die
        aktuelle Syntaxon-ID als auch den historischen EEA-EUNIS-Code an
        (Fallback über `eea_code`, eindeutig); die Habitattyp-Kanten werden
        unter der aufgelösten ID gesucht.
      operationId: syntaxonHabitatTypes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Die verknüpften Habitattypen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitatTypeSummary"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Typology:
      name: typology
      in: path
      required: true
      description: >-
        Typologie in ihrer Fassung. Ein leeres Segment fällt auf eunis@2021
        zurück (der Pfad selbst verlangt ein Segment, weglassen lässt sich es
        also nicht). Eine unbekannte Typologie ist INVALID_QUERY, kein
        NOT_FOUND.
      schema:
        type: string
        example: eunis@2021
    Code:
      name: code
      in: path
      required: true
      description: Code des Habitattyps innerhalb der Typologie.
      schema:
        type: string
        example: R22
    Lang:
      name: lang
      in: query
      required: false
      description: >-
        Antwortsprache, alternativ per Accept-Language. Lokalisierte Felder
        kommen additiv hinzu — name_en bleibt immer gesetzt. Default ist en.
      schema:
        type: string
        enum: [en, de]
    Area:
      name: area
      in: query
      required: false
      description: >-
        Gebietscode nach WGSRPD Level 3 — das Frontend leitet ihn aus GPS ab, so
        braucht situs keine ISO-Zuordnung. Ist er gesetzt, tragen die Arten- und
        Habitattyp-Einträge zusätzlich in_area. Ein Code, zu dem der Index keine
        Verbreitungsdaten hat, ist INVALID_QUERY und nicht "kommt nicht vor" —
        sonst sähen ein Tippfehler und eine echte Abwesenheit gleich aus.
      schema:
        type: string
        example: GER
    AreaScheme:
      name: scheme
      in: query
      required: false
      description: >-
        Das Gebietsschema. `wgsrpd_l3` (Vorgabe) sind die
        WGSRPD-Level-3-Gebiete der **Artverbreitung**; `evc_territory` sind
        die 136 Territorien der **Syntaxa-Verbreitung** (Staaten und
        biogeografische Teile davon, meist mit eigener Küstenspalte). Eine
        Abbildung zwischen beiden gibt es nicht und soll es nicht geben —
        keine Antwort rechnet ein Territorium in einen WGSRPD-Code um. Ein
        unbekanntes Schema ist INVALID_QUERY.
      schema:
        type: string
        enum: [wgsrpd_l3, evc_territory]
        default: wgsrpd_l3
    OnlyInArea:
      name: only_in_area
      in: query
      required: false
      description: >-
        Verwirft die sicheren Abwesenheiten (in_area=false). Was nicht beurteilbar
        ist (in_area fehlt), bleibt immer stehen. Ohne area ist der Parameter
        absichtlich wirkungslos statt ein Fehler. Auf dem Batch-Endpunkt markiert
        area nur, verwirft aber keinen Eintrag: dort gehört response[i] zu
        concept_ids[i], ein Eintrag darf also nicht fehlen.
      schema:
        type: boolean
    Rank:
      name: rank
      in: query
      required: false
      description: >-
        Rang der gelisteten Syntaxa. Weggelassen sind es die Formationen, nicht
        alle Zeilen. Die erlaubten Werte liest der Dienst aus dem Index
        (`SELECT DISTINCT rank`) statt sie zu verdrahten: das Schema hat bewusst
        kein CHECK auf `rank`, damit ein weiterer Rang eine Datenzeile sein
        kann. Ein unbekannter Wert ist INVALID_QUERY und die Nachricht nennt
        die Werte, die dieser Index führt — niemals eine leere Liste, die wie
        „gibt es nicht“ aussieht.
      schema:
        type: string
        example: alliance
    LifeFormGroup:
      name: life_form_group
      in: query
      required: false
      description: >-
        Lebensform-Gruppe der Formation, zu der ein Syntaxon gehört. Gespeichert
        ist der Wert nur auf Formationszeilen; für jeden anderen Rang filtert
        der Dienst über den Weg zur Formation. Die Wertemenge ist fest (sie
        steht als CHECK im Schema) und keine Erweiterungsstelle; ein unbekannter
        Wert ist INVALID_QUERY.
      schema:
        type: string
        enum: [phanerogam, bryophyte_lichen, algae]
    SyntaxonArea:
      name: area
      in: query
      required: false
      description: >-
        Territoriumscode des Schemas `evc_territory` (Liste:
        `GET /v1/areas?scheme=evc_territory`). Gefiltert wird auf Syntaxa mit
        einer passenden Verbreitungszeile; Syntaxa **ohne** Aussage bleiben in
        der Liste und sind daran erkennbar, dass ihnen `occurrence` fehlt —
        dieselbe Dreiwertigkeit wie `in_area` bei den Arten.

        Braucht rank=alliance: syntaxon_distribution und
        syntaxon_distribution_coverage tragen ausschließlich alliance-Zeilen.
        Mit einem anderen Rang — dem Vorgabewert formation, class oder order —
        ist die Kombination INVALID_QUERY. Ein Code, den das Schema nicht
        kennt, ebenso — nie eine Liste von „kommt nicht vor".
      schema:
        type: string
        example: austria-alps
    SyntaxonInclude:
      name: include
      in: query
      required: false
      description: >-
        Kommagetrennte Menge aus `verified` und `uncertain`, in beliebiger
        Reihenfolge; Vorgabe ist `verified`. `include=uncertain` allein ist
        gültig. Ein unbekanntes Element, ein leerer Eintrag und ein doppelt
        angegebener Parameter sind INVALID_QUERY — eine stillschweigend
        ignorierte Filterangabe wäre schlimmer als eine abgelehnte. Ohne
        `area` ist der Parameter wirkungslos und deshalb ebenfalls
        INVALID_QUERY, statt vorzugeben, er hätte gewirkt.
      schema:
        type: string
        example: verified,uncertain
  responses:
    InvalidQuery:
      description: Die Anfrage ist fehlerhaft (INVALID_QUERY).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Es gibt keinen solchen Eintrag (NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # Dieselbe Fehlerhülle wie überall. Sie ist nur an /v1/info ausgewiesen,
    # weil dort ein Auslöser benannt und getestet ist (eine fehlschlagende
    # Index-Abfrage); die anderen Routen können INTERNAL_ERROR ebenfalls
    # liefern, aber nur als unspezifizierten Ausfall.
    InternalError:
      description: Ein Fehler auf der Dienstseite (INTERNAL_ERROR).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Role:
      type: string
      enum: [diagnostic, constant, dominant]
    # Fehlende Angaben sind abwesende Felder, nie ein Platzhalter oder eine
    # substituierte Null: level fehlt bei Typologien ohne Hierarchie, priority
    # gibt es nur bei annex1, name_de nur wenn ein Label existiert.
    # name_de ist ein Objekt, nicht ein String mit Geschwisterfeld: ein Client soll
    # value nicht lesen koennen, ohne provenance daneben zu sehen. Manche Labels
    # sind amtlich, andere hat situs selbst uebersetzt — das darf nicht abtrennbar
    # sein.
    GermanLabel:
      type: object
      required: [value, provenance, source]
      properties:
        value:
          type: string
        vernacular:
          type: string
          description: >-
            Etablierter deutscher Begriff. Fehlt, wo keiner denselben Umfang
            traegt wie der Typ — ein leerer Wert waere eine Behauptung.
        provenance:
          type: string
          enum: [official, curated, derived, situs]
          description: >-
            situs bedeutet: situs hat uebersetzt, keine externe Quelle steht
            dahinter.
        source:
          type: string
    DescriptionText:
      description: >-
        Die Beschreibung eines Habitattyps samt Herkunft ihres Wortlauts.
        `provenance: official` heißt, der Text ist der Wortlaut einer externen,
        zitierbaren Quelle (die EUNIS-ESy-Factsheets). `provenance: situs`
        heißt, situs hat den Text aus den unter `source` genannten Quellen
        verfasst; für diesen Wortlaut steht keine Behörde ein.
      type: object
      required: [value, provenance, source]
      properties:
        value:
          type: string
          example: Hay meadows of lowland and montane areas.
        provenance:
          type: string
          enum: [official, situs]
        source:
          type: string
          example: floraveg:eunis-habitat-factsheets:2021-06-01
    HabitatTypeSummary:
      type: object
      required: [typology, code, name_en]
      properties:
        typology:
          type: string
          example: eunis@2021
        code:
          type: string
          example: R22
        level:
          type: integer
        name_en:
          type: string
        name_de:
          $ref: '#/components/schemas/GermanLabel'
        priority:
          type: boolean
    SyntaxonRef:
      type: object
      required: [id, rank, name]
      properties:
        id:
          type: string
        rank:
          type: string
          enum: [formation, class, order, alliance]
        name:
          type: string
        author:
          type: string
          description: >-
            Autorschafts-Zitat, direkt aus FloraVeg.EU übernommen; fehlt bei
            den Einheiten, die nur die EEA-EUNIS-Quelle führt.
        parent_id:
          type: string
          description: >-
            Verweist auf den übergeordneten Syntaxon (reine String-Referenz,
            kein Fremdschlüssel). Fehlt nur bei einer Formation — sie ist die
            Wurzel der Hierarchie.
        eea_code:
          type: string
          description: >-
            Der EEA-EUNIS-Code desselben Syntaxons; fehlt bei Formationen und
            bei Einheiten, die nur eine der beiden Quellen kennt.
        source:
          type: string
          enum: [evc, eunis]
          description: >-
            Welche Quelle diese Zeile führt: die EuroVegChecklist (evc) oder
            allein die EEA-EUNIS-Zuordnung (eunis).
        parent_provenance:
          type: string
          enum: [official, derived]
          description: >-
            Ob parent_id aus der Quelle stammt (official) oder aus dem
            Geschwisterkonsens abgeleitet wurde (derived).
        life_form_group:
          type: string
          enum: [phanerogam, bryophyte_lichen, algae]
          description: >-
            Die Lebensform-Gruppe der Formation. Nur auf Formationszeilen
            gesetzt und deshalb in Antworten, die Verbände oder Ordnungen
            tragen, nicht vorhanden.
        name_de:
          allOf:
            - $ref: "#/components/schemas/GermanLabel"
          description: >-
            Der deutsche Name, additiv zu `name` — `name` bleibt die Identität
            und trägt weiter den wissenschaftlichen Namen. Nur mit `?lang=de`
            und nur dort, wo eine Übersetzung existiert: übersetzt sind die
            **25 Formationen** (`data/localizations-de-syntaxa.csv`,
            `provenance: situs`). Klassen, Ordnungen und Verbände tragen das
            Feld nicht — ein Verband, der das Label seiner Formation erbte,
            hieße falsch, statt hilfsweise zu heißen.
        occurrence:
          type: string
          enum: [verified, uncertain]
          description: >-
            Nur in einer mit `?area=` gefilterten Liste gesetzt. **Fehlt**,
            wenn die Quelle über dieses Syntaxon keine Aussage macht — die
            Zeile wird dann mitgeführt, aber nicht als Vorkommen behauptet.
    SyntaxonDetail:
      description: >-
        Ein Syntaxon mit seiner Umgebung: der Weg nach oben und die direkten
        Kinder. `allOf`, weil die Go-Struktur `SyntaxonRef` einbettet und dessen
        Felder damit in dasselbe JSON-Objekt einwandern — ein verschachteltes
        Objekt hier und ein flaches auf der Leitung wären zwei Verträge, die
        sich als einer ausgeben. `life_form_group` steht nur in `SyntaxonRef`
        und wird hier nicht wiederholt; für jeden Rang außer der Formation ist
        der Wert aus der Formation des Ahnenpfads abgeleitet und deshalb
        nachvollziehbar, nicht behauptet.
      allOf:
        - $ref: "#/components/schemas/SyntaxonRef"
        - type: object
          required: [ancestors, children, direct_habitat_type_count]
          properties:
            ancestors:
              type: array
              description: >-
                Der Weg zur Wurzel, ÄUSSERSTE zuerst (Formation, dann Klasse,
                dann Ordnung). Für eine Formation leer — leer und vorhanden,
                nicht fehlend.
              items:
                $ref: "#/components/schemas/SyntaxonRef"
            children:
              type: array
              description: >-
                Die direkten Kinder, nach `id` sortiert. Für einen Verband leer;
                das ist die untere Grenze der freien Daten (Assoziationen sind
                pan-europäisch nicht verfügbar), kein Fehler. Auch hier ist die
                leere Liste vorhanden und nicht weggelassen.
              items:
                $ref: "#/components/schemas/SyntaxonRef"
            direct_habitat_type_count:
              type: integer
              description: >-
                Die Zahl der Habitattypen, die GENAU dieses Syntaxon verlinken —
                nicht die seiner Nachkommen. Für eine Klasse oder Formation
                praktisch immer 0, weil `habitat_type_syntaxon` Verbände
                verlinkt (und in einem Fall eine Ordnung). Der Name sagt das,
                damit die 0 nicht als „diese Klasse berührt keinen EUNIS-Typ“
                gelesen wird.
              example: 3
            distribution:
              allOf:
                - $ref: "#/components/schemas/SyntaxonDistribution"
              description: >-
                Fehlt, wenn die Quelle über dieses Syntaxon keine Aussage macht —
                dann ist NICHTS über sein Vorkommen bekannt, was von „kommt
                nirgends vor" streng zu trennen ist.
    SyntaxonDistribution:
      description: >-
        Die Verbreitungsaussage der Quelle (Preislerová et al. 2022/2024,
        CC-BY 4.0) über ein Syntaxon. `verified` und `uncertain` sind
        sortierte Codelisten des Schemas `evc_territory` — die Codes selbst
        listet `GET /v1/areas?scheme=evc_territory`.

        **Abwesenheit wird nicht aufgezählt.** 136 minus die belegten Codes
        wäre eine erfundene Liste. Zwei leere Listen bedeuten „geprüft, kommt
        in keinem Territorium vor"; **fehlt das ganze Objekt**, liegt
        überhaupt keine Aussage vor. Das sind zwei verschiedene Dinge: die
        Quelle deckt nur *vascular-plant dominated vegetation* ab, weshalb
        gemessen 212 der 1326 Verbände — darunter alle 190 Moos-, Flechten-
        und Algenverbände — kein `distribution` tragen.
      type: object
      required: [area_scheme, verified, uncertain]
      properties:
        area_scheme:
          type: string
          enum: [evc_territory]
        verified:
          type: array
          description: Codes mit belegtem Vorkommen (Quellwert `1`).
          items:
            type: string
          example: [austria-alps, czech-republic]
        uncertain:
          type: array
          description: Codes mit unsicherem Vorkommen (Quellwert `U`).
          items:
            type: string
          example: [poland-sudetes]
    TraitValue:
      type: object
      required: [dim, value]
      properties:
        dim:
          type: string
        value:
          type: number
        niche_width:
          type: number
          description: Fehlt, wenn das Vokabular keine Nischenbreite liefert (Tichý, Midolo).
        n_systems:
          type: integer
          description: Fehlt, wenn das Vokabular keine Systemanzahl liefert (Tichý, Midolo).
    TraitSet:
      type: object
      required: [vocab, vocab_version, values]
      properties:
        vocab:
          type: string
          example: eive
        vocab_version:
          type: string
          example: "1.0"
        values:
          type: array
          items:
            $ref: "#/components/schemas/TraitValue"
    CrosswalkRef:
      description: >-
        Die Gegenseite einer Entsprechung, gesehen vom abgefragten Typ. Der
        Qualifier liest sich immer als "abgefragter Typ <qualifier> dieser Typ".
      type: object
      required: [typology, code, qualifier]
      properties:
        typology:
          type: string
        code:
          type: string
        qualifier:
          type: string
          example: "="
    AggregateSource:
      description: >-
        name is absent: the index only persists the aggregate's concept id,
        never its name.
      type: object
      required: [concept_id]
      properties:
        concept_id:
          type: string
        name:
          type: string
    SpeciesEntry:
      description: >-
        verbatim_name ist immer gesetzt; concept_id fehlt, wenn der Name nicht
        auf ein Konzept auflösbar war — solche Zeilen werden behalten.
        provenance/derived_from erscheinen nur bei einer aus einer Sammelart
        abgeleiteten Zeile.
      type: object
      required: [verbatim_name, role]
      properties:
        concept_id:
          type: string
        verbatim_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        fidelity:
          type: number
        constancy:
          type: number
        in_area:
          $ref: "#/components/schemas/InArea"
        provenance:
          type: string
          enum: [derived_from_aggregate]
        derived_from:
          $ref: "#/components/schemas/AggregateSource"
    SpeciesSearchHit:
      type: object
      required: [verbatim_name, concept_id]
      properties:
        verbatim_name:
          type: string
          example: Fagus sylvatica
        concept_id:
          type: string
          nullable: true
          description: >-
            `null`, wenn der Ingest diesen Namen nicht auflösen konnte. Das
            Feld ist immer vorhanden — ein fehlendes und ein leeres Feld
            wären für einen Client nicht unterscheidbar.
          example: wcvp:concept:83891
    HabitatTypeDetail:
      allOf:
        - $ref: "#/components/schemas/HabitatTypeSummary"
        - type: object
          required: [species, syntaxa, crosswalks]
          properties:
            description:
              allOf:
                - $ref: "#/components/schemas/DescriptionText"
              description: >-
                Die Beschreibung des Habitattyps auf Englisch, mit ihrer
                Herkunft. **Fehlt**, wenn zu diesem Typ keine vorliegt. Eine
                Beschreibung wird **nie** von einem übergeordneten Typ geerbt:
                ein Untertyp ist nicht das, was sein Obertyp ist.
            description_de:
              allOf:
                - $ref: "#/components/schemas/GermanLabel"
              description: >-
                Deutsche Übersetzung von `description`, nur bei `?lang=de` und
                nur, wo eine eingelesen wurde. Overlay wie `name_de`: der
                englische Text bleibt die Identität, `provenance: situs`
                bedeutet, dass situs selbst übersetzt hat.
            species:
              description: >-
                Nach Rolle gruppiert; die drei bekannten Rollen sind immer
                vorhanden, ggf. als leere Liste.
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: "#/components/schemas/SpeciesEntry"
            syntaxa:
              type: array
              items:
                $ref: "#/components/schemas/SyntaxonRef"
            crosswalks:
              type: array
              items:
                $ref: "#/components/schemas/CrosswalkRef"
    HabitatTypeRole:
      allOf:
        - $ref: "#/components/schemas/HabitatTypeSummary"
        - type: object
          required: [role, syntaxa]
          properties:
            role:
              $ref: "#/components/schemas/Role"
            fidelity:
              type: number
            constancy:
              type: number
            syntaxa:
              type: array
              items:
                $ref: "#/components/schemas/SyntaxonRef"
            in_area:
              $ref: "#/components/schemas/InArea"
            provenance:
              type: string
              enum: [derived_from_aggregate]
            derived_from:
              $ref: "#/components/schemas/AggregateSource"
    InArea:
      description: >-
        Dreiwertig: true/false, wenn der Index Verbreitungsdaten zum Konzept
        hat, und abwesend, wenn die Frage nicht beantwortbar ist (keine
        Konzept-ID oder keine Verbreitungszeilen). Ohne ?area= fehlt das Feld
        immer — Abwesenheit ist hier "unbekannt", nie "kommt nicht vor".

        Auf POST /v1/species/habitat-types trägt nur ConceptResolution selbst
        dieses Feld: in den verschachtelten habitat_types-Einträgen fehlt es
        auch mit ?area=, denn die Aussage gilt der Art und wäre dort für jeden
        Habitattyp derselben Art dieselbe Konstante. Auf
        GET /v1/species/{conceptId}/habitat-types, wo es keine Eintragsebene
        darüber gibt, ist habitat_types[].in_area dagegen gesetzt.
      type: boolean
    ConceptResolution:
      description: >-
        Ein Eintrag der Batch-Antwort. Bei known=false ist habitat_types leer und
        reason sagt, warum: unknown_backbone heißt, das ID-Präfix ist nicht
        `wcvp:` — geprüft wird gegen dieses fest einkompilierte Präfix, nicht
        gegen die Selbstauskunft aus /v1/info; unknown_concept heißt, das Präfix
        stimmt, aber der Index kennt keine Habitat-Fakten zu diesem Konzept. Die
        Eingabe wird in beiden Fällen zurückgemeldet, nie verworfen.
      type: object
      required: [concept_id, known, habitat_types]
      properties:
        concept_id:
          type: string
        known:
          type: boolean
        reason:
          type: string
          enum: [unknown_backbone, unknown_concept]
        in_area:
          $ref: "#/components/schemas/InArea"
        habitat_types:
          type: array
          items:
            $ref: "#/components/schemas/HabitatTypeRole"
    AreaView:
      description: >-
        Ein Verbreitungsgebiet, nach dem gefiltert werden kann: `scheme` ist
        `wgsrpd_l3` (WGSRPD-Level-3, "botanische Länder", für die
        Artverbreitung) oder `evc_territory` (die 136 Territorien der
        Syntaxa-Verbreitung). `code` ist die Identität, `name` der englische
        Name als Overlay — leer, wenn zu dem Code kein Name eingelesen wurde.
      type: object
      required: [scheme, code, name]
      properties:
        scheme:
          type: string
          example: wgsrpd_l3
        code:
          type: string
          example: GER
        name:
          type: string
          example: Germany
    TypologyView:
      description: >-
        Eine Typologie: eine Klassifikationssystem-Fassung, z. B.
        `eunis@2021`, `eunis@2012` oder `annex1`. `habitat_types` ist die
        gemessene Zahl der Habitattypen dieser Typologie im Index.
      type: object
      required: [id, scheme, version, name, source_ref, habitat_types]
      properties:
        id:
          type: string
          example: annex1
        scheme:
          type: string
          example: annex1
        version:
          type: string
          example: 92/43/EEC
        name:
          type: string
          example: Habitats Directive Annex I
        source_ref:
          type: string
        habitat_types:
          type: integer
          description: >-
            Zahl der Habitattypen dieser Typologie, am Index gemessen. 0 ist
            eine ehrliche Aussage — registriert, aber nicht gefüllt —, kein
            Fehler.
          example: 205
    Info:
      type: object
      required: [service, version, index]
      properties:
        service:
          type: string
        version:
          type: string
        index:
          $ref: "#/components/schemas/IndexInfo"
    # Die Selbstauskunft des Index. Jede Zahl ist am Index *gemessen*, nichts
    # davon ist konfiguriert: ein Client soll vorab prüfen können, ob seine
    # Konzept-IDs zu diesem Index passen, statt es an leeren Antworten zu
    # merken. Bewusst nicht enthalten: die *Fassung* der Backbone (etwa
    # "wcvp 2026-06-15") — der Ingest schreibt sie heute nicht mit, und eine
    # erfundene Fassung wäre schlimmer als keine.
    IndexInfo:
      type: object
      required:
        [
          concept_backbones,
          species_with_concept,
          area_scheme,
          areas_with_data,
          syntaxon_area_scheme,
          syntaxa_with_distribution,
        ]
      properties:
        concept_backbones:
          type: array
          description: >-
            Die im Index vorkommenden Konzept-ID-Präfixe, sortiert. Erwartet ist
            genau `["wcvp"]` — nur solche IDs beantwortet die Batch-Route, denn
            sie prüft gegen ein fest einkompiliertes Präfix. Etwas anderes hier
            heißt darum nicht "auch diese IDs sind beantwortbar", sondern
            "Index und Binary passen nicht zueinander".
          items:
            type: string
          example: ["wcvp"]
        species_with_concept:
          type: integer
          description: Zahl der verschiedenen Konzept-IDs im Index.
          example: 3135
        area_scheme:
          type: string
          enum: [wgsrpd_l3]
          description: >-
            Das Vokabular der `?area=`-Codes auf den **Arten**-Routen
            (WGSRPD Level 3). Der Name steht in der Einzahl, weil er vor dem
            zweiten Schema veröffentlicht wurde und ein Feldname in einer
            Antwort keine Geschmacksfrage ist — siehe `syntaxon_area_scheme`
            für das der Syntaxa.
          example: wgsrpd_l3
        areas_with_data:
          type: integer
          description: >-
            Zahl der verschiedenen Gebietscodes mit Verbreitungszeilen. 0, solange
            kein Verbreitungs-Ingest gelaufen ist — das ist eine wahre Aussage
            über den Index, kein Platzhalter. Es ist eine Anzahl und keine Liste:
            *welche* Codes gültig sind, sagt keine Route.
          example: 366
        syntaxon_area_scheme:
          type: string
          enum: [evc_territory]
          description: >-
            Das Vokabular der `?area=`-Codes auf den **Syntaxa**-Routen (die
            136 EVC-Territorien). Steht auch dann, wenn
            `syntaxa_with_distribution` 0 ist: das Schema gehört zu dieser
            Fassung des Dienstes, die Zahl zu diesem Index. Zwischen den
            beiden Schemata gibt es keine Abbildung.
          example: evc_territory
        syntaxa_with_distribution:
          type: integer
          description: >-
            Gemessene Zahl der Syntaxa, über die die Quelle **überhaupt** eine
            Aussage macht. 0 bis ein Verbreitungs-Ingest gelaufen ist — das
            ist eine wahre Aussage über den Index, kein Platzhalter. Gemessen
            gegen die gepinnten Artefakte: 1114.
          example: 1114
    TraitSummary:
      type: object
      required: [requested, known, unknown, vocabularies]
      properties:
        requested:
          type: integer
          description: Zahl der angefragten Concept-IDs.
        known:
          type: integer
          description: Zahl der Konzepte, zu denen der Index Zeigerwerte führt.
        unknown:
          type: array
          items:
            $ref: "#/components/schemas/UnknownConcept"
        vocabularies:
          type: object
          description: Vokabular-ID -> Auswertung. Leer, wenn nichts auflösbar war.
          additionalProperties:
            $ref: "#/components/schemas/VocabSummary"
    UnknownConcept:
      type: object
      required: [concept_id, reason]
      properties:
        concept_id:
          type: string
        reason:
          type: string
          enum: [unknown_backbone, unknown_concept]
          description: >-
            `unknown_backbone`: das ID-Präfix passt nicht zum Index (Fehler
            des Aufrufers). `unknown_concept`: richtiges Präfix, aber keine
            Zeigerwerte vorhanden (Grenze der Daten).
    VocabSummary:
      type: object
      required: [vocab_version, dimensions]
      properties:
        vocab_version:
          type: string
          example: "1.0"
        dimensions:
          type: object
          description: Dimensions-Kürzel -> Statistik. Dimensionen ohne einen einzigen Wert fehlen.
          additionalProperties:
            $ref: "#/components/schemas/DimensionSummary"
    DimensionSummary:
      type: object
      required: [mean, min, max, n, n_missing]
      properties:
        mean:
          type: number
          description: Arithmetisches Mittel über alle Arten mit Wert in dieser Dimension.
        mean_niche_weighted:
          type: number
          description: >-
            Mit `1/Nischenbreite` gewichtetes Mittel. **Fehlt** bei
            Vokabularen ohne Nischenbreiten (Tichý, Midolo) — es wird nie mit
            dem ungewichteten Mittel gefüllt.
        sd:
          type: number
          description: Stichproben-Standardabweichung (n-1). **Fehlt** bei n < 2.
        min:
          type: number
        max:
          type: number
        n:
          type: integer
          description: Arten mit Wert in dieser Dimension.
        n_missing:
          type: integer
          description: Bekannte Arten ohne Wert in dieser Dimension.
        n_excluded_weighted:
          type: integer
          description: >-
            Arten, die aus dem gewichteten Mittel fielen, weil ihre
            Nischenbreite nicht positiv war. Fehlt, wenn keine betroffen war.
    # Die einheitliche Fehlerhülle jeder Antwort (writeError) — identisch zu
    # hostus. Codes: INVALID_QUERY, NOT_FOUND, INTERNAL_ERROR. Es gibt kein
    # UPSTREAM_UNAVAILABLE: der Lesepfad ist autark, zur Laufzeit hängt kein
    # Upstream-Dienst daran. Eine Konzept-ID, die der Index nicht beantworten
    # kann, ist ausdrücklich KEIN Fehler: der Batch-Endpunkt meldet sie je
    # Eingabe mit known=false und einem reason zurück, damit eine unbekannte ID
    # nicht die ganze Anfrage verwirft.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
