# gremlins mutation-testing configuration.
#
# The globals stay at 0 on purpose: the thresholds are per package and live in
# .mutation-thresholds, enforced by scripts/mutation-gate.sh. That keeps an ad-hoc
# `gremlins unleash <pkg>` informational and stops one package's threshold from
# being applied to another.
#
# Coverage says a line ran; mutation says a test would have caught a bug in it.
#
# timeout-coefficient: gremlins derives each mutant's timeout from the baseline
# test run. The sqlite and hostus suites open real databases and real HTTP test
# servers, and at the default coefficient 51 sqlite and 31 hostus mutants were
# reported TIMED OUT — which gremlins counts as killed. Raising the coefficient
# turned those into real verdicts and exposed four survivors the default had
# hidden. Lower this only after re-measuring; a timeout is a false kill.
unleash:
  threshold-efficacy: 0
  threshold-mcover: 0
  timeout-coefficient: 60
