# release-please owns VERSION und CHANGELOG.md: jeder Push auf main aktualisiert
# den Release-PR; sein Merge taggt den Release, hängt die Binaries an, pusht das
# Container-Image nach GHCR und veröffentlicht die MkDocs-Seite.
#
# Warum Image und Doku hier und nicht in einem `on: release`-Workflow: ein
# Release, das eine Action mit dem Default-GITHUB_TOKEN anlegt, löst keine
# weiteren Workflows aus (GitHubs Rekursionsschutz). Ein `on: release`-Job liefe
# also nie — es entstünde nicht einmal ein roter Check, weil überhaupt kein Run
# angelegt wird. Die Bedingung auf release-pleases eigenes `release_created` ist
# das, was Image und Doku bei *jedem* Release erscheinen lässt, auch beim ersten.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Archive + checksums an den Release hängen
      packages: write # Image nach ghcr.io pushen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # QEMU + buildx sind es, die den arm64-Build auf einem amd64-Runner möglich
      # machen. Ohne sie scheitert der arm64-Eintrag in .goreleaser.yml.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Derselbe Aufruf, den `make verify` und der CI-Docs-Job als Gate nutzen —
      # hier wird das Ergebnis aber veröffentlicht statt verworfen. An den Release
      # gebunden, damit die sichtbare Doku zur veröffentlichten Version passt.
      - name: mkdocs build --strict
        run: make docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
