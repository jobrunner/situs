# release-please owns VERSION und CHANGELOG.md: jeder Push auf main aktualisiert
# den Release-PR; sein Merge taggt den Release, hängt die Binaries an, pusht das
# Container-Image nach GHCR und veröffentlicht die MkDocs-Seite.
#
# Warum Image und Doku hier und nicht in einem `on: release`-Workflow: ein
# Release, das eine Action mit dem Default-GITHUB_TOKEN anlegt, löst keine
# weiteren Workflows aus (GitHubs Rekursionsschutz). Ein `on: release`-Job liefe
# also nie — es entstünde nicht einmal ein roter Check, weil überhaupt kein Run
# angelegt wird. Die Bedingung auf release-pleases eigenes `release_created` ist
# das, was Image und Doku bei *jedem* Release erscheinen lässt, auch beim ersten.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Mint a short-lived installation token for the "release-please-fieldworksdiary"
      # GitHub App (Contents + Pull requests, both read/write) instead of a
      # long-lived PAT: release-please's commits on the release PR need to
      # TRIGGER required-status-check workflows, which commits pushed with the
      # default GITHUB_TOKEN do NOT (GitHub's workflow loop-prevention) — that
      # leaves the release PR permanently BLOCKED once checks are required. An
      # App token has the same effect as a PAT here but is scoped to this repo,
      # short-lived, and revoked automatically at the end of the job.
      - name: Generate release-please App token
        id: app-token
        # continue-on-error is what makes the `|| secrets.GITHUB_TOKEN` fallback
        # below real: without it, a missing/invalid App secret fails this step
        # and the whole job stops before release-please ever runs — the "falls
        # back to GITHUB_TOKEN" claim would be false.
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}
          # Narrow the minted token to exactly what release-please needs,
          # rather than inheriting the App's whole installation grant
          # (zizmor github-app finding).
          permission-contents: write
          permission-pull-requests: write

      # continue-on-error keeps a misconfigured App secret from silently
      # passing as green: the step above is allowed to fail, but this one
      # makes that failure a visible, annotated warning on the run instead of
      # nothing at all — the run still falls back to GITHUB_TOKEN, but an
      # operator sees why the release PR risks going blocked.
      - name: Warn if the App token could not be minted
        if: steps.app-token.outcome == 'failure'
        run: echo "::warning::release-please App token minting failed (check RELEASE_PLEASE_APP_ID/RELEASE_PLEASE_APP_KEY) — falling back to GITHUB_TOKEN, which does not trigger required-status-check workflows on the release PR."

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Archive + checksums an den Release hängen
      packages: write # Image nach ghcr.io pushen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # QEMU + buildx sind es, die den arm64-Build auf einem amd64-Runner möglich
      # machen. Ohne sie scheitert der arm64-Eintrag in .goreleaser.yml.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Auf die exakte Version gepinnt, nicht auf einen Major: setup-uv pflegt
      # ab v8 keine beweglichen Major-Tags mehr (v1 bis v7 gibt es, v8/v9/v10
      # nicht). Ein @v10 laesst sich nicht aufloesen und bricht den Job sofort
      # mit "unable to find version" ab.
      - uses: astral-sh/setup-uv@v10.2.0
      # Derselbe Aufruf, den `make verify` und der CI-Docs-Job als Gate nutzen —
      # hier wird das Ergebnis aber veröffentlicht statt verworfen. An den Release
      # gebunden, damit die sichtbare Doku zur veröffentlichten Version passt.
      - name: mkdocs build --strict
        run: make docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
