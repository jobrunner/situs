# Mutation testing (gremlins). The thresholds are a RATCHET and live in
# .mutation-thresholds; scripts/mutation-gate.sh enforces them per package and is
# the same entrypoint as `make mutation`, so a local run and CI cannot diverge.
#
# The gate runs one gremlins invocation per package, never `./internal/...`:
# gremlins does not expand the `...` wildcard and reported success while
# generating zero mutants for the whole foundation. The script fails on a package
# that produces no mutants unless .mutation-thresholds declares NONE for it.
name: Mutation

on:
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC

permissions:
  contents: read

jobs:
  mutation:
    name: gremlins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: |
          version=$(make -s print-gremlins-version)
          echo "gremlins $version"
          go install "github.com/go-gremlins/gremlins/cmd/gremlins@${version}"
          # Put the go install dir on PATH so the gate runs the version just
          # installed (go install honours GOBIN when set, else the first GOPATH/bin).
          gobin="$(go env GOBIN)"; [ -n "$gobin" ] || gobin="$(go env GOPATH)/bin"
          echo "$gobin" >> "$GITHUB_PATH"
      - name: Run the mutation gate
        run: ./scripts/mutation-gate.sh
